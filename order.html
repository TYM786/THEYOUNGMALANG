*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums;
}
body.ur { font-family: 'Noto Naskh Arabic', 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.6; }
h1, h2, h3, .display { font-family: 'Fraunces', Georgia, serif; font-weight: 900; letter-spacing: -.01em; margin: 0; }
body.ur h1, body.ur h2, body.ur h3, body.ur .display { font-family: 'Noto Naskh Arabic', serif; letter-spacing: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.sm { font-size: 12.5px; }
.b { font-weight: 700; }
.r { text-align: end; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.gap6 { gap: 6px; } .gap4 { gap: 4px; } .mt { margin-top: 12px; } .mt2 { margin-top: 20px; } .mb { margin-bottom: 12px; }
.only-mobile { display: none; }

/* ---------- buttons: sticker style ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; user-select: none;
  min-height: 42px; padding: 8px 16px; border-radius: 12px; font-weight: 700;
  background: var(--surface); color: var(--text); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge);
  transition: transform .06s, box-shadow .06s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--edge); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.dark { background: var(--edge); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.ghost:active:not(:disabled) { transform: none; background: var(--surface2); }
.btn.sm { min-height: 34px; padding: 4px 12px; border-radius: 10px; box-shadow: 0 2px 0 var(--edge); font-size: 13.5px; }
.btn.ghost.sm { box-shadow: none; }
.btn.lg { min-height: 54px; font-size: 17px; border-radius: 14px; }
.btn.block { width: 100%; }
.icon-btn { background: none; border: 0; cursor: pointer; font-size: 20px; line-height: 1; padding: 6px 8px; border-radius: 8px; color: inherit; }
.icon-btn:hover { background: var(--surface2); }

/* ---------- inputs ---------- */
label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; color: var(--muted); }
input, select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 10px; background: var(--surface);
  border: 2px solid var(--line); color: var(--text); font-weight: 500;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--edge); outline: none; }
input[type=checkbox], input[type=radio] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--edge); flex: none; }
select { padding-inline-end: 8px; }
.pw { position: relative; }
.pw button { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); }
.err { color: var(--danger); font-weight: 600; min-height: 20px; font-size: 13.5px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }

/* ---------- chips, pills, badges ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600;
  background: var(--surface); border: 2px solid var(--line); display: inline-flex; align-items: center; gap: 6px;
}
.chip.on { background: var(--edge); color: #fff; border-color: var(--edge); }
[data-theme="dark"] .chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface2); border: 1.5px solid var(--line); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); border-color: var(--ok); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); border-color: var(--warn); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); border-color: var(--danger); color: var(--danger); }
.pill.gray { background: color-mix(in srgb, var(--gray) 16%, transparent); border-color: var(--gray); color: var(--muted); }
.pill.info { background: color-mix(in srgb, var(--info) 16%, transparent); border-color: var(--info); color: var(--info); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--gray); flex: none; }
.dot.green { background: #22B45E; } .dot.orange { background: #FF8A00; } .dot.gray { background: #9A9488; } .dot.red { background: #E5432F; }
.src { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: var(--edge); color: #fff; letter-spacing: .02em; }
.src.online, .src.qr { background: var(--info); }
.src.dinein { background: var(--ok); } .src.phone { background: var(--warn); }
[data-theme="dark"] .src { background: #3a352f; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
.card h3 { font-size: 18px; margin-bottom: 10px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 16px; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 20px; background:
  radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 40%), var(--bg); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 2px solid var(--edge); border-radius: 22px; padding: 26px; box-shadow: 0 8px 0 var(--edge); display: flex; flex-direction: column; gap: 14px; }
.login-brand { text-align: center; }
.logo-plate { background: var(--plate); border-radius: 16px; padding: 8px; display: inline-block; line-height: 0; }
.logo-plate img { height: 120px; max-width: 100%; object-fit: contain; }
.login-brand p { margin: 8px 0 0; color: var(--muted); font-weight: 600; }
.login-title { text-align: center; font-size: 22px; }
.login-clock { display: flex; justify-content: center; }
.login-tools { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.login-tools select { width: auto; min-height: 34px; }
.login-foot { text-align: center; color: var(--muted); font-size: 12.5px; margin: 0; }
.setup-warn { background: #fff3cd; color: #5c4400; border: 2px solid #e0b100; padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }

/* ---------- analog clock ---------- */
.clock { display: inline-flex; align-items: center; gap: 8px; }
.clock svg { display: block; }
.c-face { fill: var(--plate); stroke: var(--edge); stroke-width: 3; }
.c-tick { stroke: #141210; stroke-width: 2; stroke-linecap: round; }
.c-hand { stroke-linecap: round; }
.c-h { stroke: #141210; stroke-width: 4.5; } .c-m { stroke: #141210; stroke-width: 3; } .c-s { stroke: #E5432F; stroke-width: 1.6; }
.c-pin { fill: #E5432F; }
.clock-digi { display: flex; flex-direction: column; line-height: 1.15; }
.clock-digi b { font-size: 16px; }
.clock-digi span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.login-clock .clock-digi { align-items: flex-start; } .login-clock .clock-digi b { font-size: 22px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100%; }
.sidebar { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; overflow-y: auto; }
.sidebar .logo-plate { margin: 0 4px 10px; display: block; text-align: center; padding: 6px; }
.sidebar .logo-plate img { height: 78px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; cursor: pointer; border: 0; background: transparent;
  color: inherit; font-weight: 600; text-align: start; width: 100%; min-height: 44px;
}
.nav-item:hover { background: var(--side-hover); }
.nav-item.on { background: var(--side-active); color: var(--side-active-text); }
.nav-item .ic { width: 22px; text-align: center; font-size: 18px; flex: none; }
.nav-item .badge { margin-inline-start: auto; background: var(--danger); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 8px; font-weight: 800; }
.nav-sep { flex: 1; }
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface); border-bottom: 2px solid var(--edge); min-height: 68px; }
.tb-title { font-family: 'Fraunces', serif; font-weight: 900; font-size: 22px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.ur .tb-title { font-family: 'Noto Naskh Arabic', serif; }
.tb-right { display: flex; align-items: center; gap: 10px; }
.tb-right select { width: auto; min-height: 36px; padding: 4px 8px; }
.tb-user { display: flex; align-items: center; gap: 8px; padding-inline-start: 6px; border-inline-start: 2px solid var(--line); }
.tb-user .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 900; border: 2px solid var(--edge); flex: none; }
.tb-user b { display: block; line-height: 1.1; }
.tb-user small { color: var(--muted); font-weight: 600; }
.live { font-size: 12px; font-weight: 800; color: var(--ok); white-space: nowrap; }
.live.off { color: var(--gray); }
.view { flex: 1; overflow: auto; padding: 16px; }
.view.fill { display: flex; flex-direction: column; overflow: hidden; padding: 10px 16px 16px; }
.view.fill > .pos, .view.fill > .kds { flex: 1; min-height: 0; }
.view-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.view-head h2 { font-size: 24px; margin-inline-end: auto; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
.tab.on { background: var(--edge); color: #fff; border-color: var(--edge); }
[data-theme="dark"] .tab.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.tab .n { background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 800; }

/* ---------- dashboard ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: 'Fraunces', serif; font-weight: 900; font-size: 30px; line-height: 1.1; }
body.ur .stat .v { font-family: 'DM Sans', sans-serif; }
.stat .l { color: var(--muted); font-weight: 600; font-size: 13px; }
.stat.hero { background: var(--brand); color: var(--brand-ink); border: 2px solid var(--edge); grid-column: span 2; }
.stat.hero .l { color: inherit; opacity: .8; }
.stat.hero .v { font-size: 40px; }
.section-h { margin: 22px 0 10px; font-size: 18px; }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.quick .btn { min-height: 64px; flex-direction: column; font-size: 14px; gap: 2px; }
.quick .btn .ic { font-size: 22px; }

/* ---------- POS screen ---------- */
.pos { display: grid; grid-template-columns: 150px minmax(0, 1fr) 390px; gap: 12px; height: 100%; }
.pos-col { min-height: 0; overflow-y: auto; }
.cats { display: flex; flex-direction: column; gap: 8px; }
.cat { padding: 12px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-align: start; min-height: 52px; display: flex; gap: 8px; align-items: center; }
.cat.on { background: var(--brand); color: var(--brand-ink); border-color: var(--edge); box-shadow: 0 3px 0 var(--edge); }
.prod-tools { display: flex; gap: 8px; margin-bottom: 10px; position: sticky; top: 0; background: var(--bg); padding-bottom: 6px; z-index: 2; }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pcard { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 0; cursor: pointer; text-align: start; overflow: hidden; display: flex; flex-direction: column; transition: transform .08s; }
.pcard:active { transform: scale(.97); }
.pcard:hover { border-color: var(--edge); }
.pcard .ph, .pcard img { height: 92px; width: 100%; object-fit: cover; display: grid; place-items: center; font-size: 42px; background: var(--surface2); }
.pcard .pi { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.pcard .pn { font-weight: 700; line-height: 1.2; }
.pcard .pp { font-family: 'Fraunces', serif; font-weight: 900; font-size: 16px; margin-top: auto; }
.pcard.off { opacity: .5; pointer-events: none; }
.cart { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.cart-h { padding: 12px 14px; background: var(--surface2); border-bottom: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.cart-h .chips .chip { min-height: 34px; padding: 3px 10px; font-size: 13px; }
.cart-lines { flex: 1; overflow-y: auto; padding: 6px 14px; min-height: 80px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.line .ln { font-weight: 700; }
.line .lp { font-weight: 700; text-align: end; }
.line .lm { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.line .lc { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
.qty { display: inline-flex; align-items: center; border: 2px solid var(--edge); border-radius: 10px; overflow: hidden; }
.qty button { width: 38px; height: 34px; border: 0; background: var(--surface2); font-size: 20px; font-weight: 800; cursor: pointer; }
.qty span { min-width: 34px; text-align: center; font-weight: 800; }
.cart-f { padding: 12px 14px; border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.tot-row { display: flex; justify-content: space-between; font-weight: 600; }
.tot-row.grand { font-family: 'Fraunces', serif; font-weight: 900; font-size: 24px; }
body.ur .tot-row.grand { font-family: 'Noto Naskh Arabic', serif; }
.cart-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cart-btns .btn { padding: 4px 4px; font-size: 12.5px; min-height: 38px; }
.cart-toggle { display: none; }
.banner { background: color-mix(in srgb, var(--info) 14%, transparent); border: 1.5px solid var(--info); color: var(--text); padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 13px; }

/* ---------- order cards ---------- */
.ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.ocard { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ocard.new { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 35%, transparent); }
.ocard .oh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ocard .on { font-family: 'Fraunces', serif; font-weight: 900; font-size: 18px; margin-inline-end: auto; }
.ocard .items { font-size: 13.5px; color: var(--muted); }
.ocard .om { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.ocard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.ocard .acts .btn { flex: 1; min-width: 96px; }
.olist-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.olist-tools input, .olist-tools select { width: auto; min-width: 140px; flex: 1; max-width: 260px; }

/* ---------- kitchen ---------- */
.kds { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; height: 100%; overflow-x: auto; }
.kcol { background: var(--surface2); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
.kcol h3 { font-size: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: -10px; background: var(--surface2); padding: 6px 2px; z-index: 1; }
.kcard { background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.kcard.late { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 30%, transparent); }
.kcard .kn { font-family: 'Fraunces', serif; font-weight: 900; font-size: 20px; margin-inline-end: auto; }
.kcard .ki { font-size: 17px; font-weight: 700; padding: 3px 0; }
.kcard .ki small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.kcard .ki .add { color: var(--danger); font-weight: 800; }
.kcard .note { background: #fff3cd; color: #5c4400; border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 13.5px; }
.kcard.done { opacity: .65; }

/* ---------- tables ---------- */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tcard { border: 2.5px solid var(--edge); border-radius: 18px; padding: 14px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 130px; text-align: start; }
.tcard .tc { font-family: 'Fraunces', serif; font-weight: 900; font-size: 26px; }
.tcard.available { border-color: var(--ok); } .tcard.available .st { color: var(--ok); }
.tcard.occupied { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); } .tcard.occupied .st { color: var(--danger); }
.tcard.reserved { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); } .tcard.reserved .st { color: var(--warn); }
.tcard .st { font-weight: 800; font-size: 13px; }

/* ---------- riders ---------- */
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.rcard { background: var(--surface); border: 2px solid var(--line); border-inline-start: 8px solid var(--gray); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rcard.available { border-inline-start-color: #22B45E; } .rcard.on_delivery { border-inline-start-color: #FF8A00; }
.rcard.offline { border-inline-start-color: #9A9488; } .rcard.inactive { border-inline-start-color: #E5432F; }
.rcard .rn { font-weight: 800; font-size: 17px; }
.rcard .rid { font-family: 'Fraunces', serif; font-weight: 900; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; font-weight: 600; text-align: end; }
.rider-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.rider-pick .rp { border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: var(--surface); text-align: start; display: flex; flex-direction: column; gap: 2px; }
.rider-pick .rp.on { border-color: var(--edge); background: var(--brand); color: var(--brand-ink); }
.bar { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1.5px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--brand); }
.bar.done i { background: var(--ok); }

/* ---------- data tables ---------- */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: start; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; background: var(--surface2); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--surface2); }
.tbl td.num, .tbl th.num { text-align: end; }
.tbl tfoot td { font-weight: 800; background: var(--surface2); }

/* ---------- modal / toast ---------- */
.modal-wrap { position: fixed; inset: 0; background: rgba(10, 8, 6, .55); display: grid; place-items: center; padding: 14px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); color: var(--text); border: 2px solid var(--edge); border-radius: 20px; width: min(520px, 100%); max-height: calc(100vh - 28px); display: flex; flex-direction: column; box-shadow: 0 8px 0 var(--edge); }
.modal.wide { width: min(860px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2px solid var(--line); }
.modal-h h3 { font-size: 20px; }
.modal-b { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.confirm-msg { font-size: 16px; margin: 0; }
#toast-root { position: fixed; inset-inline-end: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--edge); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.3); max-width: 340px; border-inline-start: 6px solid var(--brand); }
.toast.err { border-inline-start-color: var(--danger); background: #3a1410; }
.toast.ok { border-inline-start-color: var(--ok); }
[data-theme="dark"] .toast { background: #000; border: 1px solid #444; border-inline-start-width: 6px; }

/* ---------- receipt ---------- */
.rcpt-box { background: #fff; color: #000; padding: 14px; border-radius: 10px; border: 1.5px dashed #999; max-width: 340px; margin: 0 auto; width: 100%; font-family: 'Courier New', monospace; font-size: 13px; }
.rcpt-box img { height: 70px; display: block; margin: 0 auto 6px; }
.rcpt-box h4 { margin: 0; text-align: center; font-size: 16px; }
.rcpt-box .c { text-align: center; } .rcpt-box table { width: 100%; border-collapse: collapse; }
.rcpt-box td { padding: 2px 0; vertical-align: top; } .rcpt-box td.r { text-align: right; }
.rcpt-box hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
.rcpt-box .t td { font-weight: 800; font-size: 15px; }

/* ---------- customer site ---------- */
.site-head { background: var(--surface); border-bottom: 2px solid var(--edge); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
.site-head .logo-plate img { height: 56px; }
.site-hero { padding: 18px 16px 6px; max-width: 1100px; margin: 0 auto; }
.site-hero h1 { font-size: clamp(26px, 5vw, 40px); }
.site-wrap { max-width: 1100px; margin: 0 auto; padding: 8px 16px 120px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; }
.site-cats { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; position: sticky; top: 84px; background: var(--bg); z-index: 5; }
.site-cats .chip { flex: none; }
.cart-side { position: sticky; top: 96px; align-self: start; }
.fab { display: none; }
.hint { font-size: 12.5px; color: var(--muted); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) { .pos { grid-template-columns: 120px minmax(0, 1fr) 340px; } .app { grid-template-columns: 200px 1fr; } }
@media (max-width: 900px) {
  .only-mobile { display: inline-flex; }
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: 250px; z-index: 40; transform: translateX(-105%); transition: transform .2s; }
  [dir="rtl"] .sidebar { transform: translateX(105%); }
  .app.menu-open .sidebar { transform: none; }
  .tb-clock .clock-digi, .tb-user div:not(.avatar) small { display: none; }
  .pos { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .cats { flex-direction: row; overflow-x: auto; }
  .cat { flex: none; }
  .cart { position: fixed; inset: 0; z-index: 30; border-radius: 0; transform: translateY(105%); transition: transform .2s; }
  .pos.cart-open .cart { transform: none; }
  .cart-toggle { display: inline-flex; position: fixed; inset-inline: 14px; bottom: 14px; z-index: 25; }
  .pos.cart-open .cart-toggle { display: none; }
  .site-wrap { grid-template-columns: 1fr; }
  .cart-side { position: fixed; inset: 0; z-index: 30; background: var(--bg); padding: 12px; overflow-y: auto; transform: translateY(105%); transition: transform .2s; }
  body.cart-open .cart-side { transform: none; }
  .fab { display: inline-flex; position: fixed; inset-inline: 14px; bottom: 14px; z-index: 25; }
  body.cart-open .fab { display: none; }
  .kds { grid-template-columns: repeat(4, 280px); }
  .stat.hero { grid-column: span 1; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .topbar { padding: 6px 10px; } .tb-right select { display: none; } .view { padding: 10px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .sidebar, .topbar, .btn, .no-print { display: none !important; } body { background: #fff; } .view { overflow: visible; } }

</style>

/* ---------- toast / modal ---------- */
function toast(msg, kind = 'ok') {
  const root = $('#toast-root'); if (!root) return;
  const d = document.createElement('div'); d.className = `toast ${kind}`; d.textContent = msg; root.appendChild(d);
  setTimeout(() => d.remove(), kind === 'err' ? 6000 : 3200);
}
const Modal = {
  open({ title = '', html = '', wide = false, onClose, onMount }) {
    const w = document.createElement('div'); w.className = 'modal-wrap';
    w.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div><div class="modal-b">${html}</div></div>`;
    w._onClose = onClose;
    w.addEventListener('mousedown', e => { w._down = e.target === w; });
    w.addEventListener('click', e => { if ((e.target === w && w._down) || e.target.closest('[data-close]')) Modal.close(w); });
    $('#modal-root').appendChild(w);
    onMount && onMount(w);
    return w;
  },
  close(w) { w = w || $$('.modal-wrap').pop(); if (!w) return; w.remove(); w._onClose && w._onClose(); },
  closeAll() { $$('.modal-wrap').forEach(w => Modal.close(w)); }
};
function confirmBox(msg, { ok = 'Confirm', danger = false } = {}) {
  return new Promise(res => {
    let done = false;
    const w = Modal.open({
      title: t('Please confirm'),

      onClose: () => { if (!done) res(false); }
    });
    $('#cf-ok', w).onclick = () => { done = true; res(true); Modal.close(w); };
  });
}
function askText(title, label, { value = '', type = 'text', ok = 'Save', textarea = false } = {}) {
  return new Promise(res => {

    const w = Modal.open({

/* ---------- server calls ---------- */
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw new Error(friendlyErr(error));
  return data;
}
function friendlyErr(e) {
  const m = (e && e.message) || String(e);
  if (/JWT|expired/i.test(m)) return t('Session expired — please log in again');
  if (/Failed to fetch|NetworkError/i.test(m)) return t('No internet connection');
  if (/duplicate key/i.test(m)) return t('This already exists');
  if (/violates row-level security/i.test(m)) return t('Not allowed');
  return m;
}
async function safe(fn, { busy } = {}) {
  if (busy) busy.disabled = true;
  try { return await fn(); }
  catch (e) { console.error(e); toast(friendlyErr(e), 'err'); }
  finally { if (busy) busy.disabled = false; }
}
async function q(promise) { const { data, error } = await promise; if (error) throw new Error(friendlyErr(error)); return data; }

/* ---------- sounds ---------- */
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 880].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      const s = ac.currentTime + i * 0.2; g.gain.setValueAtTime(0.2, s); g.gain.exponentialRampToValueAtTime(0.001, s + 0.18); o.start(s); o.stop(s + 0.19);
    });
  } catch (e) { /* audio blocked */ }
}

/* ---------- analog clock ---------- */
function mountClock(box, size = 52) {
  if (!box) return;
  const ticks = [...Array(12)].map((_, i) => `<line class="c-tick" x1="0" y1="-41" x2="0" y2="${i % 3 === 0 ? -34 : -37}" transform="rotate(${i * 30})"/>`).join('');
  box.innerHTML = `<div class="clock"><svg viewBox="-50 -50 100 100" width="${size}" height="${size}" role="img" aria-label="Clock"><circle r="47" class="c-face"/>${ticks}<line class="c-hand c-h" x1="0" y1="3" x2="0" y2="-22"/><line class="c-hand c-m" x1="0" y1="4" x2="0" y2="-32"/><line class="c-hand c-s" x1="0" y1="8" x2="0" y2="-36"/><circle r="3" class="c-pin"/></svg><div class="clock-digi"><b></b><span></span></div></div>`;
  const h = $('.c-h', box), m = $('.c-m', box), s = $('.c-s', box), tb = $('.clock-digi b', box), dt = $('.clock-digi span', box);
  const tick = () => {
    const d = new Date(), sec = d.getSeconds(), min = d.getMinutes() + sec / 60, hr = (d.getHours() % 12) + min / 60;
    h.setAttribute('transform', `rotate(${hr * 30})`); m.setAttribute('transform', `rotate(${min * 6})`); s.setAttribute('transform', `rotate(${sec * 6})`);
    tb.textContent = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    dt.textContent = d.toLocaleDateString(LANG === 'ur' ? 'ur-PK' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  tick(); return setInterval(tick, 1000);
}

      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
      if (error) { $('#su-err', w).textContent = /already/i.test(error.message) ? t('Username already taken') : error.message; return; }
      Modal.close(w);
      if (data.session) { const ok = await this.enter(data.session); if (ok) return; }
      toast(t('Account created — ask an admin to activate it, then log in'), 'ok');
    }, { busy: $('#su-go', w) });
  },
  async logout() {
    try { this.cfg.onLogout && await this.cfg.onLogout(); } catch (e) { /* ignore */ }
    await sb.auth.signOut(); location.reload();
  }
};

/* ---------- realtime ---------- */
const Live = {
  start(tables, cb) {
    this.stop();
    this.ch = sb.channel('ym-live-' + Math.random().toString(36).slice(2));
    tables.forEach(tb => this.ch.on('postgres_changes', { event: '*', schema: 'public', table: tb }, p => cb(tb, p)));
    this.ch.subscribe(st => { const el = $('#tb-live'); if (el) el.classList.toggle('off', st !== 'SUBSCRIBED'); });
    // safety net: if the realtime connection drops, still refresh every 30 seconds
    this.poll = setInterval(() => cb('poll', null), 30000);
  },
  stop() { if (this.ch) sb.removeChannel(this.ch); clearInterval(this.poll); }
};

/* ---------- item picker (size / add-ons / notes) shared by POS + website ---------- */
const NOTE_CHIPS = ['No Onion', 'Extra Spicy', 'Less Spicy', 'No Sauce', 'Extra Sauce', 'Well Done'];
function openItemPicker({ product, variants, addons, initial, onAdd }) {
  const pv = variants.filter(v => v.product_id === product.id).sort((a, b) => a.sort - b.sort || a.price - b.price);
  const pa = addons.filter(a => a.is_active !== false && (a.category_id == null || a.category_id === product.category_id));
  const st = { vid: initial?.variant_id ?? (pv[0] ? pv[0].id : null), add: new Set((initial?.addons || []).map(a => a.id)), qty: initial?.qty || 1, note: initial?.note || '' };
  const calc = () => {
    const v = pv.find(x => x.id === st.vid); const base = v ? num(v.price) : num(product.price);
    const ad = pa.filter(a => st.add.has(a.id)); return { v, ad, unit: base + ad.reduce((s, a) => s + num(a.price), 0) };
  };
  const body = () => {
    const c = calc();
    return `<div class="row"><b class="grow" style="font-size:18px">${esc(pick(product))}</b><span class="display" style="font-size:20px">${money(c.unit)}</span></div>
      ${pv.length ? `<div><div class="muted b sm mb">${t('Size')}</div><div class="chips">${pv.map(v => `<button type="button" class="chip ${v.id === st.vid ? 'on' : ''}" data-v="${v.id}">${esc(pick(v))} · ${money(v.price)}</button>`).join('')}</div></div>` : ''}
      ${pa.length ? `<div><div class="muted b sm mb">${t('Add-ons')}</div><div class="chips">${pa.map(a => `<button type="button" class="chip ${st.add.has(a.id) ? 'on' : ''}" data-a="${a.id}">+ ${esc(pick(a))} · ${money(a.price)}</button>`).join('')}</div></div>` : ''}
      <div><div class="muted b sm mb">${t('Special Instructions')}</div>
        <div class="chips mb">${NOTE_CHIPS.map(n => `<button type="button" class="chip" data-n="${esc(n)}">${t(n)}</button>`).join('')}</div>
        <input id="ip-note" value="${esc(st.note)}" placeholder="${t('e.g. No onion, extra spicy')}" maxlength="120"></div>
      <div class="row between"><div class="qty"><button type="button" data-q="-1">−</button><span>${st.qty}</span><button type="button" data-q="1">+</button></div>
      <button type="button" class="btn primary lg grow" id="ip-add">${t(initial ? 'Update Item' : 'ADD TO ORDER')} · ${money(c.unit * st.qty)}</button></div>`;
  };
  const w = Modal.open({ title: pick(product), html: `<div class="col" id="ip-body"></div>` });
  const paint = () => { $('#ip-body', w).innerHTML = body(); };
  paint();
  w.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) { st.vid = +b.dataset.v; st.note = $('#ip-note', w).value; paint(); }
    else if (b.dataset.a) { const id = +b.dataset.a; st.add.has(id) ? st.add.delete(id) : st.add.add(id); st.note = $('#ip-note', w).value; paint(); }
    else if (b.dataset.n) { const i = $('#ip-note', w); const n = t(b.dataset.n); i.value = i.value ? `${i.value}, ${n}` : n; i.focus(); }
    else if (b.dataset.q) { st.qty = Math.max(1, Math.min(50, st.qty + +b.dataset.q)); st.note = $('#ip-note', w).value; paint(); }
    else if (b.id === 'ip-add') {
      const c = calc(); st.note = $('#ip-note', w).value.trim();
      onAdd({ product_id: product.id, name: product.name, name_ur: product.name_ur, variant_id: c.v ? c.v.id : null, variant_name: c.v ? c.v.name : null,
        base: c.v ? num(c.v.price) : num(product.price), addons: c.ad.map(a => ({ id: a.id, name: a.name, price: num(a.price) })), qty: st.qty, note: st.note });
      Modal.close(w);
    }
  });
  return w;
}

/* ---------- receipts ---------- */
const Receipt = {
  // who served this order, for the "Served By" line — dine-in/QR shows the waiter,
  // delivery shows the rider (with Rider ID), manual/takeaway shows the cashier who created it.
  servedBy(o) {
    if (o.fulfillment === 'dinein' || o.source === 'qr') {
      // dine-in / QR: show the waiter if one is assigned — otherwise show nothing (no empty field)
      return o.waiter ? { label: 'Served By', name: o.waiter.full_name, id: o.waiter.staff_id } : null;
    }
    if (o.fulfillment === 'delivery') {
      const d = (o.deliveries || []).slice().sort((a, b) => b.id - a.id)[0];
      return (d && d.riders) ? { label: 'Rider', name: d.riders.name, id: d.riders.rider_code } : null;
    }
    // takeaway / walk-in / phone: show the cashier who created the order
    return o.creator ? { label: 'Served By', name: o.creator.full_name, id: o.creator.staff_id } : null;
  },
  body(o, S = {}) {
    const r = S.restaurant || {}; const phones = (r.phones || BR.phones).join(' / ');
    const lines = (o.order_items || []).map(i => `<tr><td>${i.qty} × ${esc(i.name)}${i.variant ? ` (${esc(i.variant)})` : ''}${(i.addons || []).length ? `<br><small>+ ${i.addons.map(a => esc(a.name)).join(', ')}</small>` : ''}${i.note ? `<br><small>“${esc(i.note)}”</small>` : ''}</td><td class="r">${money(i.line_total)}</td></tr>`).join('');
    const row = (l, v) => `<tr><td>${l}</td><td class="r">${v}</td></tr>`;
    const sb = this.servedBy(o);
    return `<div class="rcpt-box"><img src="${BR.logo}" alt=""><h4>${esc(r.name || BR.name)}</h4>
      <div class="c">${esc(r.address || BR.address)}<br>${esc(phones)}${r.ntn ? `<br>NTN: ${esc(r.ntn)}` : ''}</div><hr>
      <table>${row('Order No', `<b>${esc(o.order_no)}</b>`)}${row('Receipt No', esc(o.receipt_no || '—'))}${row('Date', fmtDT(o.created_at))}${row('Type', `${SRC[o.source] || o.source} / ${FUL[o.fulfillment] || o.fulfillment}`)}
      ${o.tbl ? row('Table', esc(o.tbl.code)) : ''}${o.customer_name ? row('Customer', esc(o.customer_name)) : ''}${o.phone ? row('Phone', esc(o.phone)) : ''}
      ${o.fulfillment === 'delivery' && o.address ? row('Address', esc(o.address)) : ''}
      ${sb ? row(sb.label, esc(sb.name || '') + (sb.id ? ` (${esc(sb.id)})` : '')) : ''}</table><hr>
      <table>${lines}</table><hr>
      <table>${row('Subtotal', money(o.subtotal))}${num(o.discount) ? row('Discount', '− ' + money(o.discount)) : ''}${num(o.delivery_fee) ? row('Delivery', money(o.delivery_fee)) : ''}
      ${num(o.tax) ? row('Tax', money(o.tax)) : ''}${num(o.service_charge) ? row('Service charge', money(o.service_charge)) : ''}
      <tr class="t"><td>TOTAL</td><td class="r">${money(o.total)}</td></tr>
      ${row('Payment', esc(o.payment_method || '—'))}${row('Status', (o.payment_status || '').toUpperCase())}
      ${num(o.paid_amount) && o.payment_status !== 'paid' ? row('Paid', money(o.paid_amount)) + row('Remaining', money(num(o.total) - num(o.paid_amount))) : ''}</table><hr>
      <div class="c">${esc(r.receipt_footer || 'Thank you!')}</div></div>`;
  },
  SIZES: { '58': { w: '58mm', max: '210px', font: '11px' }, '80': { w: '80mm', max: '300px', font: '12.5px' }, a4: { w: '210mm', max: '640px', font: '14px' } },
  doc(o, S, autoPrint, size = '80') {
    const sz = this.SIZES[size] || this.SIZES['80'];
    return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(o.order_no)}</title><style>
      body{margin:0;padding:${size === 'a4' ? '24px' : '8px'};font-family:'Courier New',monospace;font-size:${sz.font};color:#000;background:#fff}
      .rcpt-box{max-width:${sz.max};margin:0 auto}.rcpt-box img{height:64px;display:block;margin:0 auto 4px}h4{margin:0;text-align:center;font-size:15px}
      table{width:100%;border-collapse:collapse}td{padding:2px 0;vertical-align:top}td.r{text-align:right}.c{text-align:center}hr{border:0;border-top:1px dashed #000;margin:6px 0}.t td{font-weight:800;font-size:14px}
      @page{size:${size === 'a4' ? 'A4' : sz.w + ' auto'};margin:${size === 'a4' ? '14mm' : '3mm'}}</style></head><body>${this.body(o, S)}${autoPrint ? '<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>' : ''}</body></html>`;
  },
  log(o, method) { rpc('log_receipt_print', { p_order: o.id, p_method: method }).catch(() => {}); },
  print(o, S, size = '80') {
    const w = window.open('', '_blank', 'width=420,height=640'); if (!w) return toast(t('Allow pop-ups to print'), 'err');
    w.document.write(this.doc(o, S, true, size)); w.document.close(); this.log(o, size === 'a4' ? 'A4' : size + 'mm');
  },
  download(o, S) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([this.doc(o, S, false, '80')], { type: 'text/html' })); a.download = `${o.receipt_no || o.order_no}.html`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); this.log(o, 'digital');
  }
};

/* ---------- CSV / print helpers ---------- */
function downloadCSV(name, cols, rows) {
  const qt = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '\ufeff' + [cols.map(c => qt(c.label)).join(','), ...rows.map(r => cols.map(c => qt(typeof c.get === 'function' ? c.get(r) : r[c.key])).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `${name}-${isoDate(new Date())}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function printHTML(title, html) {
  const w = window.open('', '_blank'); if (!w) return toast(t('Allow pop-ups to print'), 'err');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#000}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:5px 8px;text-align:left;font-size:13px}th{background:#eee}h2{margin:0 0 4px}.r{text-align:right}</style></head><body><h2>${esc(BR.name)}</h2><div>${esc(title)} — ${new Date().toLocaleString('en-GB')}</div><br>${html}<script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

const OS = { cats: [], products: [], variants: [], addons: [], settings: {}, cart: [], cat: null, tableCode: null, ref: uuid() };
const CART_KEY = 'ym_site_cart_v1';

async function boot() {
  setTheme(localStorage.getItem('ym_theme') || 'classic'); setLang(LANG);
  const params = new URLSearchParams(location.search);
  OS.tableCode = params.get('table');
  try { const saved = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); if (Array.isArray(saved)) OS.cart = saved; } catch (e) { /* ignore */ }
  $('#modal-root') || document.body.insertAdjacentHTML('beforeend', '<div id="modal-root"></div><div id="toast-root"></div>');
  drawShell();
  if (!CONFIGURED) { $('#site-main').innerHTML = `<div class="empty">Supabase is not connected yet. Edit js/config.js.</div>`; return; }
  const [cats, prods, vars, adds, settings] = await Promise.all([
    q(sb.from('categories').select('*').eq('is_active', true).order('sort')),
    q(sb.from('products').select('*').eq('is_active', true).order('sort')),
    q(sb.from('product_variants').select('*')),
    q(sb.from('addons').select('*').eq('is_active', true)),
    loadSettings()
  ]);
  Object.assign(OS, { cats, products: prods, variants: vars, addons: adds, settings });
  OS.cat = cats[0] && cats[0].id;
  paintCats(); paintProds(); paintCart();
  sb.channel('site-products').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, async () => {
    OS.products = await q(sb.from('products').select('*').eq('is_active', true).order('sort')); paintProds();
  }).subscribe();
}

function persist() { localStorage.setItem(CART_KEY, JSON.stringify(OS.cart)); }
function siteCalc() {
  const sub = OS.cart.reduce((s, i) => s + (i.base + i.addons.reduce((a, x) => a + x.price, 0)) * i.qty, 0);
  const chg = OS.settings.charges || {};
  const ful = OS.tableCode ? 'dinein' : ($('#site-ful') ? $('#site-ful').value : 'delivery');
  let delivery = 0;
  if (!OS.tableCode && ful === 'delivery') { delivery = num(chg.delivery_fee); if (num(chg.free_delivery_above) > 0 && sub >= num(chg.free_delivery_above)) delivery = 0; }
  const tax = Math.round(sub * num(chg.tax_pct) / 100);
  return { sub, delivery, tax, total: sub + delivery + tax, ful };
}

  const calc = siteCalc();

    ${!OS.tableCode ? `<select id="site-ful" class="mb">${['delivery', 'pickup'].map(f => `<option value="${f}">${t(FUL[f])}</option>`).join('')}</select>` : ''}
    <div id="site-lines">${OS.cart.length ? OS.cart.map((i, idx) => `<div class="line">
      <span class="ln">${esc(pick({ name: i.name, name_ur: i.name_ur }))}${i.variant_name ? ` · ${esc(i.variant_name)}` : ''}</span><span class="lp">${money((i.base + i.addons.reduce((a, x) => a + x.price, 0)) * i.qty)}</span>
      ${i.addons.length ? `<span class="lm">+ ${i.addons.map(a => esc(a.name)).join(', ')}</span>` : ''}
      <span class="lc"><span class="qty"><button data-q="-1" data-i="${idx}">−</button><span>${i.qty}</span><button data-q="1" data-i="${idx}">+</button></span><button class="icon-btn" data-rm="${idx}">🗑</button></span></div>`).join('') : `<div class="empty">${t('Your cart is empty')}</div>`}</div>
    ${OS.cart.length ? `<div class="tot-row"><span>${t('Subtotal')}</span><span>${money(calc.sub)}</span></div>
    ${calc.delivery ? `<div class="tot-row"><span>${t('Delivery')}</span><span>${money(calc.delivery)}</span></div>` : ''}
    ${calc.tax ? `<div class="tot-row"><span>${t('Tax')}</span><span>${money(calc.tax)}</span></div>` : ''}
    <div class="tot-row grand"><span>${t('TOTAL')}</span><span>${money(calc.total)}</span></div>
    <button class="btn primary lg block mt" id="site-checkout">${t('Place Order')}</button>` : ''}
    </div>`;
  const ful = $('#site-ful'); if (ful) ful.onchange = paintCart;
  $$('#site-lines [data-q]').forEach(b => b.onclick = () => { OS.cart[+b.dataset.i].qty = Math.max(1, OS.cart[+b.dataset.i].qty + +b.dataset.q); persist(); paintCart(); });
  $$('#site-lines [data-rm]').forEach(b => b.onclick = () => { OS.cart.splice(+b.dataset.rm, 1); persist(); paintCart(); });
  const cc = $('[data-close-cart]', box); if (cc) cc.onclick = () => document.body.classList.remove('cart-open');
  const co = $('#site-checkout'); if (co) co.onclick = () => checkoutModal(siteCalc());
}

function checkoutModal(calc) {
  const needAddr = !OS.tableCode && calc.ful === 'delivery';
  const w = Modal.open({
    title: t('Your Details'), html: `<div class="form-grid">
    <label class="f">${t('Customer Name')} *<input id="co-name"></label>
    <label class="f">${t('Phone Number')} *<input id="co-phone" inputmode="tel"></label>
    ${needAddr ? `<label class="f full">${t('Address')} *<textarea id="co-addr"></textarea></label>` : ''}
    <label class="f full">${t('Note')}<input id="co-note" placeholder="${t('Anything we should know?')}"></label></div>
    <div class="tot-row grand"><span>${t('TOTAL')}</span><span>${money(calc.total)}</span></div>
    <button class="btn primary lg block" id="co-go">${t('Place Order')}</button>`
  });
  $('#co-go', w).onclick = ev => safe(async () => {
    const name = $('#co-name', w).value.trim(), phone = $('#co-phone', w).value.trim(), addr = $('#co-addr', w) ? $('#co-addr', w).value.trim() : '';
    if (!name) throw new Error(t('Please enter your name'));
    if (!OS.tableCode && !phone) throw new Error(t('Please enter a valid phone number'));
    if (needAddr && !addr) throw new Error(t('Please enter your delivery address'));
    const payload = {
      client_ref: OS.ref, fulfillment: calc.ful, table_code: OS.tableCode || null,
      customer: { name, phone, address: addr }, notes: $('#co-note', w).value.trim() || null,
      items: OS.cart.map(i => ({ product_id: i.product_id, variant_id: i.variant_id, qty: i.qty, addon_ids: i.addons.map(a => a.id), note: i.note }))
    };
    const res = await rpc('place_online_order', payload);
    Modal.close(w); OS.cart = []; persist(); paintCart(); document.body.classList.remove('cart-open');
    OS.ref = uuid();
    Modal.open({
      title: `✅ ${t('Order placed!')}`, html: `<p>${t('We received your order')} — <b>#${esc(res.order_no)}</b></p>
      <p class="sm muted">${phone ? t('Track your order anytime with your order number and phone.') || '' : ''}</p>
      <button class="btn primary lg block" data-close>${t('Continue')}</button>`
    });
  }, { busy: ev.currentTarget });
}

function trackModal() {
  const w = Modal.open({
    title: t('Track Order'), html: `<div class="form-grid">
    <label class="f full">${t('Order #')}<input id="tr-no" placeholder="YM-1234"></label>
    <label class="f full">${t('Phone Number')}<input id="tr-phone"></label></div>
    <button class="btn primary lg" id="tr-go">${t('Track')}</button><div id="tr-res"></div>`
  });
  $('#tr-go', w).onclick = ev => safe(async () => {
    const res = await rpc('track_order', { p_order_no: $('#tr-no', w).value.trim(), p_phone: $('#tr-phone', w).value.trim() });
    $('#tr-res', w).innerHTML = res ? `<div class="card mt"><div class="row"><b class="grow">#${esc(res.order_no)}</b>${stPill(res.status)}</div><div class="sm mt">${t(FUL[res.fulfillment])} · ${money(res.total)}${res.rider ? ' · 🏍️ ' + esc(res.rider) : ''}</div></div>` : `<div class="banner mt">${t('Not found. Check your order number.')}</div>`;
  }, { busy: ev.currentTarget });
}

boot();

</script>
</body>
</html>
